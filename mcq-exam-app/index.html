<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Exam Practice App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        
        <!-- Upload Screen -->
        <div id="uploadScreen" class="screen active">
            <div class="card">
                <h1>📚 MCQ Exam Practice</h1>
                <p class="subtitle">Upload your questions file to start practicing</p>
                
                <div class="upload-area">
                    <input type="file" id="fileInput" accept=".txt" />
                    <label for="fileInput" class="upload-label">
                        <span class="upload-icon">📁</span>
                        <span>Choose TXT File</span>
                    </label>
                    <p class="file-info" id="fileInfo">No file chosen</p>
                </div>
                
                <div id="uploadStatus" class="status-message"></div>
            </div>
        </div>

        <!-- Configuration Screen -->
        <div id="configScreen" class="screen">
            <div class="card">
                <h2>⚙️ Quiz Configuration</h2>
                <p id="totalQuestionsInfo" class="info-text"></p>
                
                <div class="input-group">
                    <label for="questionCount">How many questions do you want?</label>
                    <input type="number" id="questionCount" min="1" placeholder="Enter number">
                </div>
                
                <button id="startQuizBtn" class="btn btn-primary">Start Quiz 🚀</button>
                <p id="configError" class="error-message"></p>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-container">
                <div class="quiz-header">
                    <div class="progress-info">
                        <span id="questionCounter">Question 1/10</span>
                        <span id="scoreDisplay">Score: 0</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>

                <div class="question-card">
                    <h3 id="questionText" class="question-text"></h3>
                    
                    <div id="optionsContainer" class="options-container">
                        <!-- Options will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="screen">
            <div class="card result-card">
                <div class="result-icon">🎉</div>
                <h2>Quiz Complete!</h2>
                
                <div class="score-box">
                    <div class="score-label">Your Score</div>
                    <div id="finalScore" class="score-value">0/10</div>
                    <div id="percentage" class="percentage">0%</div>
                </div>
                
                <div class="result-actions">
                    <button id="restartBtn" class="btn btn-secondary">🔁 Restart Quiz</button>
                    <button id="newFileBtn" class="btn btn-primary">📂 Upload New File</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
